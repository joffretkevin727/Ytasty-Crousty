[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joffret kevin", email = "joffretkevin727@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "jwt>=1.4.0",
    "passlib",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
